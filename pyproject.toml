[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-evidence-study"
version = "0.2.1"
description = "Reproducible evaluation of repeated and additional threat-report evidence"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-study = "evidence_study.cli:main"

[tool.setuptools]
packages = ["evidence_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
